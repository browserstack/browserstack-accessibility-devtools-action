# BrowserStack Accessibility DevTools — composite GitHub Action (v1: scan + report)
#
# Design of record: ADR-0035 (CI GitHub App integration), ADR-0036 (Service Account
# auth), ADR-0037 (AI remediation hand-off) — DEVA11Y-463.
#
# This is a THIN WRAPPER (ADR-0035 §2). It:
#   1. gates on a PR comment mentioning @AccessibilityDevTools + a real commenter
#      permission check (write/maintain/admin);
#   2. runs the PINNED, published CLI (@browserstack/accessibility-devtools) in
#      PR-scan mode against the base…head DIFF — it never builds/installs the PR
#      head code (fork-PR "diff, don't build" safety, ADR-0035 §7);
#   3. mints a repo-scoped Actions OIDC token (post authenticity, ADR-0035 §5);
#   4. submits the normalized findings + signed scanProof + OIDC token to the
#      BrowserStack ci-review-service, which verifies and posts AS THE APP.
#
# The Action holds NO GitHub write credential — every write (comment, check, SARIF)
# is done server-side by the App. The workflow's GITHUB_TOKEN stays read-only.

name: 'BrowserStack Accessibility DevTools'
description: 'Scan a pull request for accessibility issues and report the findings back on the PR.'
author: 'BrowserStack'

branding:
  icon: 'check-circle'
  color: 'orange'

inputs:
  username:
    description: 'BrowserStack Service Account username (store as an encrypted Actions secret). Scan auth (ADR-0036).'
    required: true
  access-key:
    description: 'BrowserStack Service Account access key (store as an encrypted Actions secret). Scan auth (ADR-0036).'
    required: true
  comment:
    description: 'Publish findings as a PR comment, authored by the App.'
    required: false
    default: 'true'
  check-gate:
    description: 'Publish a Check Run / commit status and fail the run per fail-on-severity.'
    required: false
    default: 'true'
  fail-on-severity:
    description: 'Severity at/above which check-gate fails the run: error | warning | none.'
    required: false
    default: 'error'
  inline-suggestions:
    description: 'Post one-click suggestion blocks on offending lines (small/single-line fixes).'
    required: false
    default: 'false'
  sarif:
    description: 'Upload SARIF to GitHub code-scanning (Security tab). Uploaded by the App server-side; the workflow token needs no extra permission.'
    required: false
    default: 'false'
  comment-mode:
    description: 'update a single sticky comment across runs, or post a new one each time: update | new.'
    required: false
    default: 'update'
  remediation:
    description: 'Enable the optional AI hand-off (preview; ADR-0037).'
    required: false
    default: 'false'
  ai-agent:
    description: 'Required when remediation: true. The BARE agent name (e.g. claude, coderabbitai) — the service prepends @. Validated against ^[A-Za-z0-9-]+(\[bot\])?$.'
    required: false
    default: ''

outputs:
  result:
    description: 'pass or fail.'
    value: ${{ steps.report.outputs.result }}
  error-count:
    description: 'Number of error-severity findings.'
    value: ${{ steps.report.outputs.error-count }}
  warning-count:
    description: 'Number of warning-severity findings.'
    value: ${{ steps.report.outputs.warning-count }}
  findings-count:
    description: 'Total findings.'
    value: ${{ steps.report.outputs.findings-count }}
  comment-url:
    description: 'Link to the posted PR comment.'
    value: ${{ steps.report.outputs.comment-url }}
  sarif-file:
    description: 'Path to the SARIF file (if enabled).'
    value: ${{ steps.report.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    # ---------------------------------------------------------------------------
    # 1. Guard (belt-and-suspenders: the example workflow also gates in `if:`).
    #    Only proceed for a PR comment that mentions the hardcoded trigger phrase.
    # ---------------------------------------------------------------------------
    - id: guard
      shell: bash
      env:
        # Hardcoded, not an input (ADR-0035 Appendix A).
        TRIGGER_MENTION: '@AccessibilityDevTools'
      run: |
        set -euo pipefail
        proceed=true

        if [ "${GITHUB_EVENT_NAME:-}" != "issue_comment" ]; then
          echo "::notice::Not an issue_comment event (${GITHUB_EVENT_NAME:-unknown}); skipping."
          proceed=false
        fi

        # Must be a comment on a PR (issue.pull_request present).
        if [ "$proceed" = "true" ]; then
          is_pr="$(jq -r '.issue.pull_request // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$is_pr" ]; then
            echo "::notice::Comment is not on a pull request; skipping."
            proceed=false
          fi
        fi

        # Comment body must mention the trigger phrase.
        if [ "$proceed" = "true" ]; then
          body="$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")"
          case "$body" in
            *"$TRIGGER_MENTION"*) : ;;
            *)
              echo "::notice::Comment does not mention ${TRIGGER_MENTION}; skipping."
              proceed=false
              ;;
          esac
        fi

        echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # 2. Commenter permission pre-check (best-effort — the AUTHORITATIVE, fail-closed
    #    permission check is done server-side by the ci-review-service before it
    #    posts anything as the App (ADR-0035 §5). This client-side pre-check is a
    #    fast, quota-saving reject for commenters we can definitively see are not
    #    write/maintain/admin — it is NOT the security boundary (the runner is the
    #    customer's and cannot be trusted).
    #
    #    Crucially it must degrade, not hard-fail: GET .../collaborators/{user}/
    #    permission requires push access, which the least-privilege workflow token
    #    (contents: read) deliberately lacks — so the call 403s under the documented
    #    read-only setup. Treat an inconclusive read as "proceed" and let the
    #    server-side gate enforce; only a DEFINITIVE non-privileged role refuses.
    # ---------------------------------------------------------------------------
    - id: permission
      if: steps.guard.outputs.proceed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        actor="$(jq -r '.comment.user.login // ""' "$GITHUB_EVENT_PATH")"
        repo="$GITHUB_REPOSITORY"
        if [ -z "$actor" ]; then
          echo "::error::Could not resolve the commenter login."
          exit 1
        fi
        # GET /repos/{owner}/{repo}/collaborators/{username}/permission needs push
        # access. Distinguish a definitive answer from an inconclusive call: on a
        # read-only token the call fails (gh exits non-zero) and we must NOT refuse.
        if perm="$(gh api "repos/${repo}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null)"; then
          echo "Commenter ${actor} has permission: ${perm}"
          case "$perm" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::${actor} lacks write/maintain/admin permission; refusing to scan."
              echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac
        else
          # Could not read the commenter's permission (expected with the documented
          # read-only GITHUB_TOKEN, which cannot call the collaborators API). Do not
          # hard-refuse — proceed and rely on the server-side fail-closed gate, which
          # rejects unauthorized commenters before the App posts (ADR-0035 §5).
          echo "::warning::Could not read ${actor}'s permission with the read-only workflow token; relying on the server-side permission gate."
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        fi

    # ---------------------------------------------------------------------------
    # 3. Preflight (ADR-0035 §7). Fork-PR safety does NOT come from this step:
    #    issue_comment workflows run in the BASE-repo context, so SA secrets and
    #    id-token are available even when the comment is on a fork PR. Fork safety
    #    comes from (a) the commenter permission gate above + the server-side
    #    fail-closed gate, and (b) "diff, don't build" — the secret-bearing job
    #    never executes PR head code (step 6). This step only ensures the scan has
    #    what it needs and skips cleanly when it does not (creds not configured, or
    #    id-token: write not granted) — never run with reduced trust.
    # ---------------------------------------------------------------------------
    - id: preflight
      if: steps.guard.outputs.proceed == 'true' && steps.permission.outputs.allowed == 'true'
      shell: bash
      env:
        BSTACK_USERNAME: ${{ inputs.username }}
        BSTACK_ACCESS_KEY: ${{ inputs.access-key }}
      run: |
        set -euo pipefail
        ready=true

        if [ -z "${BSTACK_USERNAME}" ] || [ -z "${BSTACK_ACCESS_KEY}" ]; then
          echo "::warning::Service Account credentials are not available (secrets not configured on this repo). Skipping scan."
          ready=false
        fi

        # ACTIONS_ID_TOKEN_REQUEST_* are present only when the job was granted
        # id-token: write. Required to prove the run is genuine CI (ADR-0035 §5).
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::warning::Actions OIDC token endpoint unavailable (missing 'id-token: write' permission). Skipping scan — will not run with reduced trust."
          ready=false
        fi

        echo "ready=$ready" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # 4. Validate the optional ai-agent input (ADR-0037; charset per review #20).
    # ---------------------------------------------------------------------------
    - id: validate-agent
      if: steps.preflight.outputs.ready == 'true' && inputs.remediation == 'true'
      shell: bash
      env:
        AI_AGENT: ${{ inputs.ai-agent }}
      run: |
        set -euo pipefail
        if [ -z "${AI_AGENT}" ]; then
          echo "::error::remediation is true but ai-agent is empty. Provide the bare agent name (e.g. coderabbitai)."
          exit 1
        fi
        # Bare name; the service prepends "@". Optional [bot] suffix.
        if ! printf '%s' "${AI_AGENT}" | grep -Eq '^[A-Za-z0-9-]+(\[bot\])?$'; then
          echo "::error::ai-agent '${AI_AGENT}' is invalid. Must match ^[A-Za-z0-9-]+(\[bot\])?$ (bare name, no @)."
          exit 1
        fi
        echo "Validated ai-agent: ${AI_AGENT} (service will post @${AI_AGENT})."

    # ---------------------------------------------------------------------------
    # 5. Resolve the PR head SHA and changed files (diff scope, hardcoded).
    # ---------------------------------------------------------------------------
    - id: pr
      if: steps.preflight.outputs.ready == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        pr_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
        repo="$GITHUB_REPOSITORY"

        # Authoritative head SHA for the issue_comment event (the event payload has
        # no PR head SHA, so resolve it — ADR-0035 §5 caveat).
        head_sha="$(gh api "repos/${repo}/pulls/${pr_number}" --jq '.head.sha')"
        base_sha="$(gh api "repos/${repo}/pulls/${pr_number}" --jq '.base.sha')"

        # Changed files (paginated), one per line, into a workspace file.
        gh api --paginate "repos/${repo}/pulls/${pr_number}/files" --jq '.[].filename' \
          > "${RUNNER_TEMP}/changed-files.txt"

        echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
        echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
        echo "changed-files=${RUNNER_TEMP}/changed-files.txt" >> "$GITHUB_OUTPUT"
        echo "Resolved PR #${pr_number} head=${head_sha} ($(wc -l < "${RUNNER_TEMP}/changed-files.txt") changed files)."

    # ---------------------------------------------------------------------------
    # 6. Check out ONLY the base…head diff. "diff, don't build": no npm install,
    #    no postinstall — the secret-bearing job never executes fork head code
    #    (ADR-0035 §7). We fetch the head tree read-only for the CLI to read file
    #    contents; deva11y.config.* is data-only and safe to read.
    # ---------------------------------------------------------------------------
    - name: Checkout PR head (read-only, no build)
      if: steps.preflight.outputs.ready == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.head-sha }}
        # Enough history for a base…head diff.
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node
      if: steps.preflight.outputs.ready == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ---------------------------------------------------------------------------
    # 7. Run the PINNED published CLI in PR-scan mode over the diff.
    #    IMPORTANT: the CLI version is pinned by THIS Action release (no @latest at
    #    runtime — ADR-0035 §2, review #4). Update CLI_VERSION when cutting a new
    #    Action release. Pinned to the published 1.5.0 (npmjs `latest`), which ships PR-scan mode.
    #    We run the pinned package directly with npx --yes so no project install /
    #    postinstall of the PR head executes.
    # ---------------------------------------------------------------------------
    - id: scan
      if: steps.preflight.outputs.ready == 'true'
      shell: bash
      env:
        # SA creds — passed to the CLI, which authenticates over WSS to linter-server.
        BROWSERSTACK_USERNAME: ${{ inputs.username }}
        BROWSERSTACK_ACCESS_KEY: ${{ inputs.access-key }}
        CHANGED_FILES: ${{ steps.pr.outputs.changed-files }}
        BASE_SHA: ${{ steps.pr.outputs.base-sha }}
        HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
      run: |
        set -euo pipefail
        # Pinned published CLI version (npmjs latest = 1.5.0; includes PR-scan mode). Do NOT use @latest.
        CLI_VERSION="1.5.0"
        FINDINGS_OUT="${RUNNER_TEMP}/findings.json"

        echo "Running @browserstack/accessibility-devtools@${CLI_VERSION} in PR-scan mode (diff scope)…"
        # --scope=diff (ADR-0022): scan only changed ranges over base…head.
        # The CLI reads file contents; it does NOT execute the project.
        npx --yes "@browserstack/accessibility-devtools@${CLI_VERSION}" scan \
          --scope=diff \
          --base "${BASE_SHA}" \
          --head "${HEAD_SHA}" \
          --changed-files "${CHANGED_FILES}" \
          --output "${FINDINGS_OUT}" \
          --format json

        echo "findings-file=${FINDINGS_OUT}" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # 8. Request the Actions OIDC token with the DevA11y audience (ADR-0035 §5).
    #    Proves "this request came from a real Actions run in repo X" — repo
    #    granularity, no user resolved. Audience matches the deployed
    #    ci-review-service verifier config.
    # ---------------------------------------------------------------------------
    - id: oidc
      if: steps.preflight.outputs.ready == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # DevA11y OIDC audience — matches the ci-review-service verifier config (oidc.audience).
        AUDIENCE="browserstack-accessibility-devtools"
        token="$(curl -sf \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"
        if [ -z "$token" ] || [ "$token" = "null" ]; then
          echo "::error::Failed to mint the Actions OIDC token."
          exit 1
        fi
        # Mask so it never lands in logs.
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # 9. Submit findings + scanProof + OIDC token to the ci-review-service.
    #    The service verifies origin (OIDC) + content (scanProof) and posts AS THE
    #    APP. The Action never posts to GitHub directly (ADR-0035 §3, §5).
    #    The service base URL is fixed (global ingress), NOT a customer input.
    # ---------------------------------------------------------------------------
    - id: submit
      if: steps.preflight.outputs.ready == 'true'
      shell: bash
      env:
        OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        FINDINGS_FILE: ${{ steps.scan.outputs.findings-file }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        OPT_COMMENT: ${{ inputs.comment }}
        OPT_CHECK_GATE: ${{ inputs.check-gate }}
        OPT_FAIL_ON: ${{ inputs.fail-on-severity }}
        OPT_INLINE: ${{ inputs.inline-suggestions }}
        OPT_SARIF: ${{ inputs.sarif }}
        OPT_COMMENT_MODE: ${{ inputs.comment-mode }}
        OPT_REMEDIATION: ${{ inputs.remediation }}
        OPT_AI_AGENT: ${{ inputs.ai-agent }}
      run: |
        set -euo pipefail
        # Service base URL (global ingress); server-side geo-routes per data-residency
        # region (ADR-0035 §7). NOT a customer input.
        SERVICE_URL="https://devtools-a11y-linter.browserstack.com"
        RESP_OUT="${RUNNER_TEMP}/service-response.json"

        # The CLI emits { findings, scanProof } — findings are normalized and the
        # scanProof is HMAC-signed by linter-server (key never on the runner).
        findings="$(jq -c '.findings // .' "${FINDINGS_FILE}")"
        scan_proof="$(jq -r '.scanProof // ""' "${FINDINGS_FILE}")"

        # Assemble the request body (ADR-0035 §5 wire shape).
        body="$(jq -cn \
          --arg repo "$REPO" \
          --argjson prNumber "$PR_NUMBER" \
          --arg headSha "$HEAD_SHA" \
          --argjson findings "$findings" \
          --arg scanProof "$scan_proof" \
          --arg oidcToken "$OIDC_TOKEN" \
          --arg comment "$OPT_COMMENT" \
          --arg checkGate "$OPT_CHECK_GATE" \
          --arg failOnSeverity "$OPT_FAIL_ON" \
          --arg inlineSuggestions "$OPT_INLINE" \
          --arg sarif "$OPT_SARIF" \
          --arg commentMode "$OPT_COMMENT_MODE" \
          --arg remediation "$OPT_REMEDIATION" \
          --arg aiAgent "$OPT_AI_AGENT" \
          '{
            platform: "github",
            repo: $repo,
            prNumber: $prNumber,
            headSha: $headSha,
            findings: $findings,
            scanProof: $scanProof,
            oidcToken: $oidcToken,
            options: {
              comment: ($comment == "true"),
              checkGate: ($checkGate == "true"),
              failOnSeverity: $failOnSeverity,
              inlineSuggestions: ($inlineSuggestions == "true"),
              sarif: ($sarif == "true"),
              commentMode: $commentMode,
              remediation: ($remediation == "true"),
              aiAgent: $aiAgent
            }
          }')"

        http_code="$(curl -sS -o "${RESP_OUT}" -w '%{http_code}' \
          -X POST "${SERVICE_URL}/v1/findings" \
          -H "Content-Type: application/json" \
          -H "X-CI-Platform: github" \
          --data-binary "${body}")"

        echo "ci-review-service responded HTTP ${http_code}"
        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "::error::ci-review-service rejected the submission (HTTP ${http_code})."
          cat "${RESP_OUT}" || true
          exit 1
        fi
        echo "response-file=${RESP_OUT}" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # 10. Report: surface outputs from the service response and apply the gate.
    # ---------------------------------------------------------------------------
    - id: report
      if: always()
      shell: bash
      env:
        RESP_FILE: ${{ steps.submit.outputs.response-file }}
        PROCEED: ${{ steps.guard.outputs.proceed }}
        ALLOWED: ${{ steps.permission.outputs.allowed }}
        READY: ${{ steps.preflight.outputs.ready }}
        OPT_CHECK_GATE: ${{ inputs.check-gate }}
      run: |
        set -euo pipefail

        # Default (skipped / not-run) outputs.
        result="pass"; error_count="0"; warning_count="0"; findings_count="0"
        comment_url=""; sarif_file=""

        if [ "${PROCEED}" != "true" ] || [ "${ALLOWED:-false}" != "true" ] || [ "${READY:-false}" != "true" ]; then
          echo "::notice::Scan did not run (guard/permission/preflight skip); reporting a neutral pass."
        elif [ -n "${RESP_FILE:-}" ] && [ -f "${RESP_FILE}" ]; then
          result="$(jq -r '.result // "pass"' "${RESP_FILE}")"
          error_count="$(jq -r '.errorCount // 0' "${RESP_FILE}")"
          warning_count="$(jq -r '.warningCount // 0' "${RESP_FILE}")"
          findings_count="$(jq -r '.findingsCount // 0' "${RESP_FILE}")"
          comment_url="$(jq -r '.commentUrl // ""' "${RESP_FILE}")"
          sarif_file="$(jq -r '.sarifFile // ""' "${RESP_FILE}")"
        else
          echo "::warning::No service response available; reporting fail."
          result="fail"
        fi

        {
          echo "result=$result"
          echo "error-count=$error_count"
          echo "warning-count=$warning_count"
          echo "findings-count=$findings_count"
          echo "comment-url=$comment_url"
          echo "sarif-file=$sarif_file"
        } >> "$GITHUB_OUTPUT"

        echo "Result: ${result} (errors=${error_count}, warnings=${warning_count}, total=${findings_count})"
        [ -n "$comment_url" ] && echo "Comment: ${comment_url}" || true

        # Gate: fail the job when check-gate is on and the service verdict is fail.
        if [ "${OPT_CHECK_GATE}" = "true" ] && [ "$result" = "fail" ]; then
          echo "::error::Accessibility check failed (fail-on-severity gate)."
          exit 1
        fi
